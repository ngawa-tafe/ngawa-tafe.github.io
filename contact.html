<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./Assets/css/site.css" rel="stylesheet">
    <title>Contact Form</title>
</head>
<body class="p-4 bg-gradient-to-tr from-emerald-950 to-emerald-50">
<header class="p-4 text-center text-black">
    <section class="py-8">
        <h2 class="text-center text-2xl font-semibold mb-6">
            Explore My Site
        </h2>
        <nav class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-4 gap-6 text-center">
            <a href="index.html"
               class="block p-4 rounded-full hover:bg-gradient-to-tr from-emerald-950 to-emerald-100 hover:text-xl transition border">
                <h3 class="text-lg font-bold mb-1">
                    Home Page
                </h3>
                <p class="hidden sm:block">
                    Go back to home page
                </p>
            </a>
            <a href="about.html"
               class="block p-4 rounded-full hover:bg-gradient-to-tr from-emerald-950 to-emerald-100 hover:text-xl transition border">
                <h3 class="text-lg font-bold mb-1">
                    About Me
                </h3>
                <p class="hidden sm:block">
                    Learn more about my background and skills.
                </p>
            </a>
            <a href="resume.html"
               class="block p-4 rounded-full hover:bg-gradient-to-tr from-emerald-950 to-emerald-100 hover:text-xl transition border">
                <h3 class="text-lg font-bold mb-1">
                    Resume
                </h3>
                <p class="hidden sm:block">
                    View my education and work history.
                </p>
            </a>
            <a href="projects.html"
               class="block p-4 rounded-full hover:bg-gradient-to-tr from-emerald-950 to-emerald-100 hover:text-xl transition border">
                <h3 class="text-lg font-bold mb-1">
                    Projects
                </h3>
                <p class="hidden sm:block">
                    See my coding projects and demos.
                </p>
            </a>
        </nav>
    </section>
</header>
<form id="contactForm" class="max-w-xl mx-auto bg-white p-6 rounded shadow p-4 bg-gradient-to-tr from-emerald-950 to-emerald-50">
    <h2 class="text-2xl font-bold mb-4">Contact Me</h2>

    <div class="mb-4">
        <label for="name" class="block mb-1 font-semibold">Name</label>
        <input type="text" id="name" name="name" class="w-full border border-gray-300 p-2 rounded">
        <p id="nameFeedback" class="text-red-600 text-sm"></p>
    </div>

    <div class="mb-4">
        <label for="email" class="block mb-1 font-semibold">Email</label>
        <input type="email" id="email" name="email" class="w-full border border-gray-300 p-2 rounded">
        <p id="emailFeedback" class="text-red-600 text-sm"></p>
    </div>

    <div class="mb-4">
        <label for="message" class="block mb-1 font-semibold">Message</label>
        <textarea id="message" name="message" rows="4" class="w-full border border-gray-300 p-2 rounded"></textarea>
        <p id="messageFeedback" class="text-red-600 text-sm"></p>
    </div>

    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Submit</button>
</form>
<footer class="text-center p-4 border-t mt-8">
    <p class="text-sm">
        © 2025 John Robertson and Ngawang Samphel, all rights reserved.
    </p>
</footer>
<script src="./Assets/js/contact.js"></script>
</body>
</html>
